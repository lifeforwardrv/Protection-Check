function normPhone(raw){let p=(raw||'').replace(/[^0-9+]/g,'');if(p.startsWith('+62'))p=p.slice(1);else if(p.startsWith('0'))p='62'+p.slice(1);else if(p&&!p.startsWith('62'))p='62'+p;return p;}
function isExisting(a){return ['Prudential','Asuransi pribadi lain','Prudential + asuransi lain'].includes(a.personal_insurance);}
function hasDependents(a){return a.dependents==='Ada';}
function hasChildren(a){return a.children==='Ya';}

function hasHealth(a){return cp(a).some(x=>['BPJS','Asuransi kesehatan dari kantor','Asuransi kesehatan pribadi'].includes(x));}
function hasPrivateHealth(a){return cp(a).includes('Asuransi kesehatan pribadi');}
function hasLife(a){return cp(a).includes('Asuransi jiwa / income protection');}
function hasCI(a){return cp(a).includes('Perlindungan penyakit kritis');}
function hasEdu(a){return cp(a).includes('Dana / investasi pendidikan anak');}
function hasRet(a){return cp(a).includes('Dana / investasi pensiun');}
const AREAS={
 health:{label:'🏥 Health Protection',areaLabel:'🏥 Health',why:'Biaya kesehatan dapat muncul tiba-tiba dan besar. Yang penting adalah memahami sumber perlindungan yang tersedia dan batasannya.',see:{green:'Kamu sudah menyebut memiliki sumber perlindungan kesehatan.',yellow:'Kamu sudah memiliki sumber perlindungan kesehatan, tetapi detail manfaat dan batasannya masih perlu dicek.',red:'Dari jawabanmu, belum terlihat adanya sumber perlindungan kesehatan pribadi yang kamu andalkan.',gray:'Belum cukup informasi untuk menilai area ini.'},next:{green:'Pastikan manfaat dan batasannya masih sesuai dengan kebutuhanmu.',yellow:'Review manfaat, limit, dan ketentuan perlindungan yang kamu miliki.',red:'Pertimbangkan sumber perlindungan kesehatan yang sesuai dengan kondisi dan kemampuanmu.',gray:'Area ini bisa dibahas lebih lanjut bila relevan.'}},
 life:{label:'❤️ Family / Income Protection',areaLabel:'❤️ Family Income',why:'Jika penghasilan utama berhenti, kebutuhan orang yang bergantung pada penghasilan tersebut tetap berjalan.',see:{green:'Kamu sudah menyebut memiliki perlindungan jiwa / income protection.',yellow:'Ada indikasi perlindungan, tetapi kecukupannya perlu dilihat bersama tanggungan dan kondisi keluarga.',red:'Ada tanggungan finansial, tetapi belum terlihat adanya perlindungan jiwa / income protection.',gray:'Tidak ada tanggungan finansial langsung yang disebutkan.'},next:{green:'Review apakah manfaatnya masih sejalan dengan tanggungan dan tujuan keluarga sekarang.',yellow:'Review jumlah perlindungan dan siapa saja yang bergantung pada income tersebut.',red:'Pertimbangkan bagaimana keluarga akan tetap berjalan jika income utama berhenti.',gray:'Tidak perlu menjadi prioritas utama selama kondisi tanggungan belum berubah.'}},
 ci:{label:'🧠 Critical Illness',areaLabel:'🧠 Critical Illness',why:'Penyakit serius dapat memengaruhi kemampuan bekerja dan cash flow, sementara kebutuhan hidup tetap berjalan.',see:{green:'Kamu sudah menyebut memiliki perlindungan penyakit kritis.',yellow:'Belum terlihat perlindungan khusus penyakit kritis.',red:'Kamu menyebut penyakit serius sebagai perhatian, tetapi belum terlihat adanya perlindungan khusus.',gray:'Belum ada informasi yang cukup untuk menilai area ini.'},next:{green:'Pastikan manfaat dan jumlah perlindungannya masih sesuai.',yellow:'Cek kembali manfaat dan jumlah perlindungan penyakit kritis yang tersedia.',red:'Pertimbangkan bagaimana cash flow keluarga akan bertahan jika kamu harus berhenti bekerja karena penyakit serius.',gray:'Tidak perlu menjadi prioritas utama bila belum menjadi concern kamu.'}},
 education:{label:'🎓 Education Planning',areaLabel:'🎓 Education',why:'Pendidikan anak adalah tujuan jangka panjang yang perlu dilihat bersama target, waktu, cash flow, dan aset yang sudah disiapkan.',see:{green:'Kamu sudah memiliki target dan rutin menyiapkan dana pendidikan.',yellow:'Kamu sudah mulai menyiapkan dana pendidikan, tetapi belum yakin apakah targetnya sudah cukup.',red:'Belum terlihat adanya persiapan yang jelas untuk dana pendidikan anak.',gray:'Belum relevan karena kamu belum menyebut memiliki anak yang perlu disiapkan pendidikannya.'},next:{green:'Review target secara berkala seiring usia anak dan perubahan biaya pendidikan.',yellow:'Coba hitung target pendidikan dan bandingkan dengan dana yang sudah disiapkan.',red:'Mulai dari menghitung kebutuhan pendidikan sebelum menentukan cara menyiapkannya.',gray:'Tidak perlu menjadi prioritas saat ini.'}},
 retirement:{label:'👵 Retirement Planning',areaLabel:'👵 Retirement',why:'Semakin jelas target pensiun, semakin banyak pilihan waktu dan strategi untuk mempersiapkannya.',see:{green:'Kamu sudah memiliki strategi dan rutin menyiapkan dana pensiun.',yellow:'Kamu sudah mulai menyiapkan dana pensiun, tetapi target atau konsistensinya masih perlu diperjelas.',red:'Belum terlihat adanya rencana pensiun yang jelas.',gray:'Belum ada informasi yang cukup untuk menilai area ini.'},next:{green:'Review target dan konsistensi secara berkala.',yellow:'Coba tetapkan target pensiun dan hitung apakah persiapan saat ini sudah menuju target tersebut.',red:'Mulai dengan menentukan target pensiun dan kebutuhan dana yang ingin dicapai.',gray:'Area ini bisa dibahas bila kamu ingin mulai menghitungnya.'}}
};
function status(area,a){
 if(area==='life'&&!hasDependents(a))return'gray'; if(area==='education'&&!hasChildren(a))return'gray';
 if(area==='health'){if(hasPrivateHealth(a))return'green';if(hasHealth(a))return'yellow';return'red';}
 if(area==='life')return hasLife(a)?'green':'red';
 if(area==='ci')return hasCI(a)?'green':((a.protect_priorities||[]).includes('Penyakit kritis')?'red':'yellow');
 if(area==='education')return hasEdu(a)?'green':((a.education_plan==='Sudah punya target dan rutin menyiapkan')?'green':(a.education_plan?'yellow':'red'));
 if(area==='retirement')return hasRet(a)?'green':((a.retirement_plan==='Sudah punya strategi dan rutin menjalankan')?'green':(a.retirement_plan?'yellow':'red'));
 return'gray';
}
const STATUS_LABEL={green:'Protection in place',yellow:'Worth reviewing',red:'Needs attention',gray:'Not assessed'};
const STATUS_CLASS={green:'status-green',yellow:'status-yellow',red:'status-red',gray:'status-gray'};
function relevantAreas(a){return ['health','life','ci','education','retirement'].filter(k=>status(k,a)!=='gray');}
function top3(map,a){const order=['life','health','ci','education','retirement'];const score={red:3,yellow:2,green:1,gray:0};return relevantAreas(a).sort((x,y)=>score[map[y]]-score[map[x]]).slice(0,3);}
function priorityLevel(a,map,intent){let p=0;if(intent==='budget')p+=4;if(intent==='understand')p+=2;if(isExisting(a)&&['> 3 tahun','Sudah lupa','Belum pernah benar-benar mengecek'].includes(a.last_review))p+=3;if(a.confidence==='Belum paham sama sekali')p+=2;if((a.life_changes||[]).length>=2)p+=1;if(Object.values(map).includes('red'))p+=2;if(a.why_now==='Cuma penasaran')p-=2;return p>=6?'HIGH':p>=3?'WARM':'NURTURE';}
function nextAction(a,map,intent){const p=priorityLevel(a,map,intent);if(p==='HIGH'&&isExisting(a))return'Offer Protection Review';if(p==='HIGH')return'Offer Family Financial Check-In';if(p==='WARM'&&isExisting(a))return'Reconnect + Review';if(p==='WARM')return'Education / Conversation';return'Nurture / No immediate action';}
function render(){if(view==='linkinvalid')return renderInvalid();if(view==='landing')return renderLanding();if(view==='assessment')return renderAssessment();if(view==='result')return renderResult();if(view==='capture')return renderCapture();if(view==='thankyou')return renderThankyou();if(view==='admin')return renderAdmin();}

 {key:'current_protection',title:'Saat ini kamu sudah memiliki perlindungan atau persiapan apa?',hint:'Pilih yang kamu tahu. Tidak perlu mengingat detail polis.',type:'multi',max:6,exclusive:'Belum memiliki perlindungan khusus',options:['BPJS','Asuransi kesehatan dari kantor','Asuransi kesehatan pribadi','Asuransi jiwa / income protection','Perlindungan penyakit kritis','Dana / investasi pendidikan anak','Dana / investasi pensiun','Belum memiliki perlindungan khusus']}
 ];
 if(isExisting(answers)){s.push({key:'last_review',title:'Kapan terakhir kali kamu benar-benar mengecek isi dan manfaat perlindunganmu?',type:'single',options:['Dalam 1 tahun','1–2 tahun','> 3 tahun','Sudah lupa','Belum pernah benar-benar mengecek']},{key:'confidence',title:'Seberapa yakin kamu memahami perlindungan yang saat ini kamu punya?',type:'single',options:['Belum paham sama sekali','Lumayan paham','Cukup paham','Sangat paham']});}
 s.push({key:'protect_priorities',title:'Kalau kondisi keuangan berubah tiba-tiba, apa yang paling ingin kamu pastikan tetap aman?',hint:'Pilih maksimal 3.',type:'multi',max:3,options:['Biaya kesehatan','Penghasilan keluarga','Keluarga jika saya meninggal','Keuangan jika terkena penyakit kritis','Pendidikan anak','Masa pensiun','Cicilan / kewajiban','Aku belum tahu — bantu aku lihat semuanya']});
 s.push({key:'why_now',title:'Apa yang bikin kamu mau cek perlindungan sekarang?',type:'single',options:['Aku ingin memastikan perlindunganku masih sesuai','Kondisi keluarga aku berubah','Kondisi pekerjaan / keuanganku berubah','Aku belum pernah benar-benar mengeceknya','Aku cuma penasaran']});
 return s;}
function renderAssessment(){const ss=steps();if(flowIndex>=ss.length){view='result';return render()};const s=ss[flowIndex];app.className='app';app.innerHTML=`<div class="assess-header"><button class="back-btn" id="backBtn" aria-label="Kembali">←</button><div class="gauge-track"><div class="gauge-fill" style="width:${Math.round(flowIndex/ss.length*100)}%"></div></div></div><div class="q-card"><p class="q-eyebrow">Pertanyaan ${flowIndex+1} dari ${ss.length}</p><h2 class="q-title">${s.title}</h2>${s.hint?`<p class="q-hint">${s.hint}</p>`:''}<div id="qBody"></div>${s.type==='multi'?'<div class="step-actions"><button class="btn btn-primary" id="nextBtn" disabled>Lanjut</button></div>':''}</div>`;document.getElementById('backBtn').onclick=()=>{if(flowIndex===0){view='landing';render()}else{flowIndex--;render()}};const qb=document.getElementById('qBody');if(s.type==='single'){qb.innerHTML='<div class="opt-grid">'+s.options.map(o=>`<button class="opt ${answers[s.key]===o?'selected':''}" data-val="${o}"><span>${o}</span><span class="check">${ICON_CHECK}</span></button>`).join('')+'</div>';qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[s.key]=b.dataset.val;flowIndex++;render()});}else{renderMulti(s,qb)}}
function renderMulti(s,qb){const cur=answers[s.key]||[];qb.innerHTML='<div class="opt-grid">'+s.options.map(o=>`<button class="opt ${cur.includes(o)?'selected':''}" data-val="${o}"><span>${o}</span><span class="check">${ICON_CHECK}</span></button>`).join('')+'</div><p class="multi-hint">Terpilih ${cur.length} dari maksimal ${s.max}</p>';qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.val;let a=[...(answers[s.key]||[])];if(s.exclusive&&v===s.exclusive){a=a.includes(v)?[]:[v]}else{a=a.filter(x=>x!==s.exclusive);const i=a.indexOf(v);if(i>-1)a.splice(i,1);else if(a.length<s.max)a.push(v)}answers[s.key]=a;renderMulti(s,qb);document.getElementById('nextBtn').disabled=!a.length});document.getElementById('nextBtn').onclick=()=>{flowIndex++;render()};}
function mapFor(a){return{health:status('health',a),life:status('life',a),ci:status('ci',a),education:status('education',a),retirement:status('retirement',a)}}
function priorityText(k,a,st){const m=AREAS[k];const see=m.see[st];let next=m.next[st];if(isExisting(a)&&st!=='red'&&st!=='gray')next='Yang perlu diperhatikan adalah apakah perlindungan tersebut masih sesuai dengan kondisi, kebutuhan, dan kemampuan finansialmu saat ini.';return{see,next,why:m.why}}
function renderResult(){const map=mapFor(answers);const shown=relevantAreas(answers);const top=top3(map,answers);resultCache={map,top};const red=shown.filter(k=>map[k]==='red').length;let standout='';if(top.length){const labels=top.map(k=>AREAS[k].areaLabel).join(' + ');standout=`<div class="standout"><h3>Yang paling layak kamu perhatikan</h3><p>Dari jawabanmu, area yang paling perlu dipikirkan lebih lanjut saat ini adalah <b>${labels}</b>. Ini bukan berarti kamu pasti membutuhkan produk tertentu — area tersebut hanya layak dilihat lebih dekat.</p></div>`}app.className='app';app.innerHTML=`<h2 class="result-title">Your Protection Snapshot</h2><p class="result-sub">Ini gambaran awal berdasarkan informasi yang kamu berikan. Bukan penilaian "aman" atau "tidak aman".</p><div class="urgency-badge ${red===0?'ok':''}">${red?`${red} area terlihat perlu perhatian lebih lanjut.`:'Kabar baik — dari informasi singkat ini, belum terlihat area merah yang perlu perhatian segera.'}</div>${isExisting(answers)&&['> 3 tahun','Sudah lupa','Belum pernah benar-benar mengecek'].includes(answers.last_review)?'<div class="review-note">Kamu menyebut sudah cukup lama tidak mengecek perlindunganmu. Karena kondisi hidup bisa berubah, review berkala bisa membantu memastikan perlindungan tetap relevan.</div>':''}<div class="map">${shown.map(k=>`<div class="map-row"><span class="map-area">${AREAS[k].areaLabel}</span><span class="status-pill ${STATUS_CLASS[map[k]]}">${STATUS_LABEL[map[k]]}</span></div>`).join('')}</div>${answers.dependents==='Aku yang bergantung pada penghasilan orang lain'?'<div class="single-income-note">Karena kamu bergantung pada penghasilan orang lain, perlindungan pencari nafkah utama juga penting untuk dibicarakan bersama keluarga.</div>':''}${standout}<div class="priority-block"><h2 style="font-size:20px;margin:0 0 10px">Kenapa area ini muncul?</h2>${top.map(k=>{const st=map[k],m=AREAS[k],t=priorityText(k,answers,st);return`<div class="priority-card"><h4>${m.label}</h4><div class="pc-block"><p class="pc-label">What we see</p><p class="pc-text">${t.see}</p></div><div class="pc-block"><p class="pc-label">Why it matters</p><p class="pc-text">${t.why}</p></div><div class="pc-block next"><p class="pc-label">Next step</p><p class="pc-text">${t.next}</p></div></div>`}).join('')}</div><div class="step-actions"><button class="btn btn-primary" id="continueBtn">Lanjut</button></div><p class="foot-note">Hasil ini adalah snapshot awal. Detail manfaat, limit, exclusions, kondisi keuangan, dan kebutuhan individual perlu dilihat lebih lanjut sebelum mengambil keputusan.</p>`;document.getElementById('continueBtn').onclick=()=>{view='capture';render()}}
function renderCapture(){app.className='app';app.innerHTML=`<h2 class="capture-title">Mau simpan hasil Protection Check kamu?</h2><p class="result-sub">Kamu sudah melihat hasilnya. Kalau mau menyimpan dan menentukan langkah berikutnya, isi kontak di bawah.</p><div class="q-card" style="margin-top:18px"><label class="field-label">Nama panggilan</label><input class="field" id="nameInput" placeholder="Contoh: Ninda" value="${answers.name||''}"><div style="height:12px"></div><label class="field-label">Nomor WhatsApp</label><input class="field" id="waInput" type="tel" placeholder="08xx xxxx xxxx" value="${answers.whatsapp||''}"></div><p class="q-eyebrow" style="margin-top:22px">Kalau kamu mau lanjut</p><button class="cta-option" data-intent="understand"><span class="cta-emoji">🟢</span><b>Bantu aku memahami hasil ini</b><span>Aku ingin ngobrol dengan advisor.</span></button><button class="cta-option" data-intent="budget"><span class="cta-emoji">🔵</span><b>Aku ingin tahu apa yang perlu aku siapkan</b><span>Aku ingin memahami langkah berikutnya.</span></button><button class="cta-option" data-intent="save"><span class="cta-emoji">⚪</span><b>Aku mau pelajari sendiri dulu</b><span>Tidak perlu dihubungi dulu.</span></button><p class="consent">Dengan menyimpan hasil, kamu setuju data yang kamu masukkan digunakan untuk keperluan Protection Check. Advisor hanya akan menghubungi kamu sesuai pilihan langkah berikutnya.</p><div class="step-actions"><button class="btn btn-primary" id="saveBtn" disabled>Simpan hasilku</button></div><p class="send-note" id="sendState" style="display:none"></p>`;const n=document.getElementById('nameInput'),w=document.getElementById('waInput'),b=document.getElementById('saveBtn');function refresh(){answers.name=n.value;answers.whatsapp=w.value;app.querySelectorAll('.cta-option').forEach(x=>x.classList.toggle('sel',x.dataset.intent===answers.intent));b.disabled=!(n.value.trim()&&normPhone(w.value).length>=10&&answers.intent)}n.oninput=refresh;w.oninput=refresh;app.querySelectorAll('.cta-option').forEach(x=>x.onclick=()=>{answers.intent=x.dataset.intent;refresh()});b.onclick=finalize;refresh()}
async function finalize(){const send=document.getElementById('sendState');const map=resultCache.map,top=resultCache.top;const intent=answers.intent;const priority=priorityLevel(answers,map,intent);const agentName=currentAgent?.name||'Tanpa advisor (General)',agentSlug=currentAgent?.slug||'';const payload={'Timestamp':new Date().toISOString(),'Agent':agentName,'Agent Slug':agentSlug,'Source':source||'direct','Nama':answers.name||'','WhatsApp':normPhone(answers.whatsapp),'Boleh Dihubungi':intent==='save'?'Belum — mau pelajari dulu':'Ya, boleh dihubungi','Life Stage':answers.life_stage||'','Perubahan Hidup':(answers.life_changes||[]).join(', '),'Tanggungan':answers.dependents||'','Punya Anak':answers.children||'','Asuransi Pribadi':answers.personal_insurance||'','Perlindungan Saat Ini':(answers.current_protection||[]).join(', '),'Terakhir Review':answers.last_review||'','Confidence':answers.confidence||'','Prioritas Proteksi':(answers.protect_priorities||[]).join(', '),'Why Now':answers.why_now||'','Health':STATUS_LABEL[map.health],'Family Income':STATUS_LABEL[map.life],'Critical Illness':STATUS_LABEL[map.ci],'Education':STATUS_LABEL[map.education],'Retirement':STATUS_LABEL[map.retirement],'Intent':intent,'Priority':priority,'Top 3 Area':top.map(k=>AREAS[k].areaLabel).join(', '),'Next Best Action':nextAction(answers,map,intent),'Status Follow-up':'','Catatan':''};document.querySelectorAll('.cta-option').forEach(x=>x.disabled=true);document.getElementById('saveBtn').disabled=true;send.style.display='block';send.textContent='Menyimpan hasil...';let saved=false;try{if(CONFIG.APPS_SCRIPT_URL&&CONFIG.APPS_SCRIPT_URL.includes('/exec')){const r=await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});saved=r.ok}}catch(e){saved=false}if(!saved){send.textContent='Hasil belum berhasil disimpan. Coba lagi sebentar.';document.querySelectorAll('.cta-option').forEach(x=>x.disabled=false);refreshCapture();return}view='thankyou';render()}
function refreshCapture(){const n=document.getElementById('nameInput'),w=document.getElementById('waInput'),b=document.getElementById('saveBtn');if(!n||!w||!b)return;answers.name=n.value;answers.whatsapp=w.value;b.disabled=!(n.value.trim()&&normPhone(w.value).length>=10&&answers.intent)}
function renderThankyou(){const first=(answers.name||'').trim().split(/\s+/)[0]||'';const top=(resultCache?.top||[]).map(k=>AREAS[k].areaLabel).join(', ');let text;if(answers.intent==='save')text=`Hasil Protection Check kamu sudah tersimpan${first?', '+first:''}. Kamu bisa kembali kapan pun saat siap melanjutkan.`;else text=`Hasil Protection Check kamu sudah tersimpan${first?', '+first:''}. Fokus utamamu saat ini: ${top||'review kondisi proteksi'}.` ;let wa='';if(answers.intent!=='save'&&currentAgent?.whatsapp){const msg=`Hai ${currentAgent.name}, aku baru selesai Protection Check${first?' atas nama '+first:''}. Aku ingin dibantu memahami hasilnya.`;wa=`<a class="btn btn-primary" href="https://wa.me/${normPhone(currentAgent.whatsapp)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Chat dengan advisor</a>`}app.className='app';app.innerHTML=`<div class="ty-wrap"><h2 class="ty-title">Protection Check kamu sudah tersimpan.</h2><p class="result-sub" style="margin-top:12px">${text}</p><div style="margin-top:22px">${wa}</div><div style="margin-top:16px"><button class="btn btn-text" id="restartBtn">Isi ulang Protection Check</button></div><div class="disclaimer"><b>Catatan penting.</b> Protection Check adalah alat edukasi dan assessment awal. Hasilnya bukan rekomendasi produk, keputusan underwriting, jaminan penerimaan asuransi, atau jaminan manfaat tertentu. Detail manfaat, eligibility, premi, dan keputusan pertanggungan mengikuti ketentuan resmi perusahaan asuransi.</div></div>`;document.getElementById('restartBtn').onclick=()=>{view='landing';flowIndex=0;answers={};resultCache=null;chosenFinalIntent=null;render()}}
function baseUrl(){return location.origin+location.pathname}
function renderAdmin(){if(!adminUnlocked){const c=prompt('Masukkan kode akses admin:');if(c!==CONFIG.ADMIN_CODE){view='landing';return render()};adminUnlocked=true}app.className='app wide';app.innerHTML=`<div class="admin-top"><div><p class="eyebrow">Admin</p><h2 style="margin:0">Protection Check — Panel Admin</h2></div><button class="btn btn-ghost" id="exitAdmin">Kembali</button></div><div class="tabs"><button class="tab-btn ${adminTab==='links'?'active':''}" id="tabLinks">Link Advisor</button><button class="tab-btn ${adminTab==='sheet'?'active':''}" id="tabSheet">Data Leads</button></div><div id="adminBody"></div>`;document.getElementById('exitAdmin').onclick=()=>{view='landing';render()};document.getElementById('tabLinks').onclick=()=>{adminTab='links';renderAdmin()};document.getElementById('tabSheet').onclick=()=>{adminTab='sheet';renderAdmin()};adminTab==='links'?renderLinks():renderSheet()}
function renderLinks(){const body=document.getElementById('adminBody');const rows=CONFIG.AGENTS.map(a=>{const link=baseUrl()+'?agent='+a.slug;return`<tr><td>${a.name}</td><td><span class="${a.active?'pill-active':'pill-inactive'}">${a.active?'Active':'Inactive'}</span></td><td><div class="link-box"><span class="link-text">${link}</span><button class="btn btn-ghost btn-sm copy" data-link="${link}">Salin</button></div></td></tr>`}).join('');body.innerHTML=`<div class="table-scroll"><table><thead><tr><th>Advisor</th><th>Status</th><th>Link</th></tr></thead><tbody>${rows}</tbody></table></div><div class="admin-note">Setiap advisor cukup memakai link <code>?agent=slug</code>. Tambahkan <code>&source=ig</code>, <code>&source=wa</code>, atau sumber lain bila ingin melacak asal lead.</div>`;body.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.link);b.textContent='Tersalin ✓';setTimeout(()=>b.textContent='Salin',1200)})}
function renderSheet(){const body=document.getElementById('adminBody');body.innerHTML=`<div class="warn-banner">Pastikan APPS_SCRIPT_URL sudah benar-benar terpasang. Website tidak akan menganggap data tersimpan jika Apps Script tidak mengembalikan respons OK.</div>${CONFIG.SHEET_URL?`<a class="btn btn-primary" href="${CONFIG.SHEET_URL}" target="_blank">Buka Google Sheet leads</a>`:'<div class="admin-note">Isi CONFIG.SHEET_URL jika ingin tombol membuka Google Sheet dari panel ini.</div>'}<div class="admin-note" style="margin-top:16px">Kolom penting untuk dashboard: Priority, Next Best Action, Why Now, Last Review, Confidence, Top 3 Area, Status Follow-up.</div>`}
render();
</script>
